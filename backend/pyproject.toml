[project]
name = "cali-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.5",
    "ddgs>=9.16.0",
    "feedparser>=6.0.14",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "lancedb>=0.40.0",
    "pandas>=3.0.6",
    "phonenumbers>=9.0.41",
    "pydantic>=2.14.1",
    "scikit-learn>=1.5",
    "sentence-transformers>=6.1.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: needs network and/or GROQ_API_KEY (run with -m live)"]
