name: Enrich backlog

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily, after the 06:00 scout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout # shared with scout.yml: the two never run at once (both commit backend/data)
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install Chromium for crawl4ai
        run: uv run playwright install --with-deps chromium

      - name: Offline tests
        run: uv run pytest -q

      - name: Enrich backlog (first-party contacts and profile links only)
        id: enrich
        continue-on-error: true # still commit what was enriched; the job is failed below
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          CRAWL4AI_NO_CLOUD_NOTICE: "1"
          CALI_CONTACT_EMAIL: ${{ secrets.CALI_CONTACT_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python enrich_run.py

      - name: Commit results to main
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: enrich backlog $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail the job if enrichment failed outright
        if: steps.enrich.outcome == 'failure'
        run: exit 1
