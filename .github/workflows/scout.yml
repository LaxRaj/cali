name: Daily startup scout

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: uv sync --frozen # Python version comes from backend/.python-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install Chromium for crawl4ai
        run: uv run playwright install --with-deps chromium

      - name: Offline tests (validators, discovery, quality gates)
        run: uv run pytest -q

      - name: Run scout (discover -> extract -> quality gates -> store -> daily brief)
        id: scout
        continue-on-error: true # still commit the run log below, so failed runs are visible on the dashboard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}  # second account: its own daily quota, used when the first is spent
          CRAWL4AI_NO_CLOUD_NOTICE: "1"
          # Optional. Empty = feature off: SEC Form D needs a contact email in its User-Agent; Jev is opt-in and paid.
          CALI_CONTACT_EMAIL: ${{ secrets.CALI_CONTACT_EMAIL }}
          CALI_DECIDER: ${{ vars.CALI_DECIDER || 'local' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python pipeline.py

      - name: Commit results to main
        if: always() && steps.scout.conclusion != 'skipped'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily scout $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail the job if the scout failed its quality gates
        if: steps.scout.outcome == 'failure'
        run: exit 1
