name: Daily startup scout

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write # health alerts + the Monday digest go to GitHub issues (free, the workflow's own token)

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: uv sync --frozen # Python version comes from backend/.python-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install Chromium for crawl4ai
        run: uv run playwright install --with-deps chromium

      - name: Offline tests (validators, discovery, quality gates)
        run: uv run pytest -q

      - name: Run scout (discover -> extract -> quality gates -> store -> daily brief)
        id: scout
        continue-on-error: true # still commit the run log below, so failed runs are visible on the dashboard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}  # second account: its own daily quota, used when the first is spent
          CRAWL4AI_NO_CLOUD_NOTICE: "1"
          # Optional. Empty = feature off: SEC Form D needs a contact email in its User-Agent; Jev is opt-in and paid.
          CALI_CONTACT_EMAIL: ${{ secrets.CALI_CONTACT_EMAIL }}
          CALI_DECIDER: ${{ vars.CALI_DECIDER || 'local' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python pipeline.py

      - name: Repair stored data (idempotent; compacts the lance tables on Mondays)
        if: always() && steps.scout.conclusion != 'skipped'
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ]; then uv run python repair.py; else uv run python repair.py --no-compact; fi

      - name: Commit results to main
        if: always() && steps.scout.conclusion != 'skipped'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily scout $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Redeploy the dashboard (optional; only if the DEPLOY_HOOK_URL secret is set)
        if: always() && steps.scout.conclusion != 'skipped'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null && echo "deploy hook triggered"; else echo "no DEPLOY_HOOK_URL secret: skipping"; fi

      - name: Health alerts and Monday digest (GitHub issues)
        if: always() && steps.scout.conclusion != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALI_DASHBOARD_URL: ${{ vars.CALI_DASHBOARD_URL }}
        run: |
          uv run python digest.py alerts --out /tmp/alerts.md > /dev/null
          open=$(gh issue list --label cali-alert --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -s /tmp/alerts.md ]; then
            gh label create cali-alert --color d93f0b --description "Scout health alert" 2>/dev/null || true
            if [ -n "$open" ]; then gh issue comment "$open" --body-file /tmp/alerts.md
            else gh issue create --title "Cali scout needs attention" --label cali-alert --body-file /tmp/alerts.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Healthy again: $(date -u +%F)."
          fi
          title="Cali weekly digest $(date -u +%F)"
          if [ "$(date -u +%u)" = "1" ] && [ -z "$(gh issue list --label cali-digest --state all --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null)" ]; then
            uv run python digest.py weekly --out /tmp/digest.md > /dev/null
            gh label create cali-digest --color 0e8a16 --description "Weekly lead digest" 2>/dev/null || true
            gh issue create --title "$title" --label cali-digest --body-file /tmp/digest.md
          fi

      - name: Fail the job if the scout failed its quality gates
        if: steps.scout.outcome == 'failure'
        run: exit 1
