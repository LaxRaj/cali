name: Daily startup scout

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: uv sync --frozen # Python version comes from backend/.python-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install Chromium for crawl4ai
        run: uv run playwright install --with-deps chromium

      - name: Run scout (scrape -> extract -> update vector store -> daily brief)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRAWL4AI_NO_CLOUD_NOTICE: "1"
        run: uv run python pipeline.py

      - name: Commit results to main
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/startups.lance backend/data/daily_brief.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily scout $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
